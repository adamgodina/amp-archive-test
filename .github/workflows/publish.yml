name: Publish AMP Archive

# Manual only — click "Run workflow" on the Actions tab whenever new files
# have been added to the archive (once or twice a quarter).
on:
  workflow_dispatch:

permissions:
  contents: write      # to commit the rebuilt site
  id-token: write      # to get a GitHub OIDC token (no client secret needed)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install msal requests

      - name: Build the site from the SharePoint archive (via Microsoft Graph)
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          SHAREPOINT_SITE_URL: ${{ secrets.SHAREPOINT_SITE_URL }}
          ARCHIVE_FOLDER: ${{ secrets.ARCHIVE_FOLDER }}
          SITE_TITLE: "AMP Stock Pitch Archive"
        run: python graph_build_site.py

      - name: Publish the updated site
        run: |
          git config user.name "amp-archive-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --staged --quiet || git commit -m "Update archive $(date +%F)"
          git push
