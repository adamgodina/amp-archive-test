 return D.filter(r=>{if(fs&&r.section!==fs)return 0;if(fy&&r.year!==fy)return 0;if(ft&&r.doc_type!==ft)return 0;
  if(q){const h=[r.ticker,r.company,r.filename].join(" ").toLowerCase();if(!h.includes(q))return 0}return 1})}
